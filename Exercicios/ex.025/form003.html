<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> formulario com mais campos</title>
</head>
<body>
    <h1>Teste de formulario</h1>
    <form action="cadstro.php" method="get" autocomplete="on">
    <p>
        <label for="inome">Nome</label>
        <input type="text" name="nome" id="inome" required maxlength="30" placeholder="Nome completo" autocomplete="name">
    </p>
     
    <p>
        <label for="imedia">Meida</label>
    <input type="number" name="media" id="imedia" min="0 " max="10" placeholder="0 a 10" step="0.5" >
    
    </p>
    
    <p>
        <label for="imes">Periodo letivo</label>
        <input type="month" name="mes" id="imes" value="2025-07">
    </p>
    <p>
        <label for="idia">Dia da Prova</label>
        <input type="date" name="dia" id="idia" value="2025-07-03">
    </p>
    <p>
        <label for="ihora">Horário da Prova</label>
        <input type="time" name="hora" id="ihora" value="19:47">
    </p>
     <p>
    <input type="submit" value="enviar">
    
    <input type="reset" value="limpar">
    </p>
</form>
</body>
</html>
